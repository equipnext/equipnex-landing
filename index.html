<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquipNext | Creative Studio & Performance Hub</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --terracotta: #D97706; --purple: #7C3AED; --bg: #FFFFFF; --dark: #0F172A; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--dark); margin: 0; padding-bottom: 80px; }
        header { padding: 25px 5%; display: flex; align-items: center; border-bottom: 1px solid #F1F5F9; }
        .logo-img { height: 75px; width: auto; object-fit: contain; }
        .hero { padding: 60px 5%; text-align: center; }
        h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 20px; line-height: 1.1; }
        h1 span { color: var(--purple); }
        .hero p { color: #475569; font-size: 1.1rem; max-width: 600px; margin: 0 auto 40px; }
        .form-container { max-width: 420px; margin: 40px auto; padding: 35px; border: 2px solid var(--dark); border-radius: 24px; background: #FAFAF9; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        input, select { width: 100%; padding: 14px; margin: 8px 0 16px 0; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; background: #FFF; }
        button { width: 100%; padding: 16px; background: var(--purple); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #6D28D9; }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 100; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="EquipNext Logo" class="logo-img">
    </header>
    
    <section class="hero">
        <h1>High-Income <span>Creative Mastery</span></h1>
        <p>Your studio for Meta Ads, UI/UX, and Modern Tech workflows.</p>
        
        <div class="form-container">
            <h3 style="margin-bottom: 15px; font-size: 1.3rem;">Join Next Cohort</h3>
            <form id="leadForm">
                <label style="font-size: 13px; font-weight: 700; color: #334155;">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
                
                <label style="font-size: 13px; font-weight: 700; color: #334155;">Choose Course</label>
                <select id="course">
                    <option value="Performance Marketing">Performance Marketing</option>
                    <option value="Creative Design & Tech">Creative Design & Tech</option>
                </select>
                
                <button type="submit">Send to WhatsApp</button>
            </form>
        </div>
    </section>

    <a href="https://wa.me/917306680158?text=Hi,%20I%20want%20to%20know%20more%20about%20EquipNext." class="whatsapp-float">
        💬 Chat on WhatsApp
    </a>

    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const course = document.getElementById('course').value;
            const msg = `Hi, I am ${name}. I want to join the ${course} course at EquipNext.`;
            window.open(`https://wa.me/917306680158?text=${encodeURIComponent(msg)}`, '_blank');
        });
    </script>
</body>
</html>
