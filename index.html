<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquipNex | Professional Career & Skills Institute</title>
    <meta name="description" content="Master high-demand tech and marketing skills with industry-certified training programs in Kerala.">
    <style>
        :root { --primary: #0f172a; --accent: #22c55e; --bg: #f8fafc; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 0; line-height: 1.6; }
        header { background: #ffffff; padding: 20px 40px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        .logo { font-weight: 800; font-size: 24px; color: var(--primary); letter-spacing: -0.5px; }
        .hero { max-width: 700px; margin: 40px auto; padding: 20px; text-align: center; }
        h1 { font-size: 32px; margin-bottom: 20px; color: var(--primary); }
        p { color: #475569; font-size: 16px; margin-bottom: 30px; }
        .lead-box { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: left; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">EquipNex</div>
    </header>

    <div class="hero">
        <h1>Accelerate Your Career With Expert-Led Training</h1>
        <p>Gain hands-on mastery in modern digital disciplines. Real-world projects, expert mentorship, and direct placement support.</p>
        
        <div class="lead-box">
            <h3 style="margin-top:0; margin-bottom:15px;">Get Course Syllabus & Fee Details</h3>
            <form>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="phone">WhatsApp Number</label>
                    <input type="tel" id="phone" required placeholder="+91 XXXXX XXXXX">
                </div>
                <button type="submit">Get Instant Access</button>
            </form>
        </div>
    </div>
</body>
</html>
